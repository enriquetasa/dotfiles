# ── Prefix ──────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key a send-prefix   # nested tmux passthrough

# ── Remapped commands (prefix + key) ────────────
bind p detach-client                              # exit
bind l last-window                                 # circle (toggle last window)
bind m command-prompt -I "#W" "rename-window '%%'"  # rename
bind i choose-window                                # picker

# ── Display / terminal ──────────────────────────
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -g history-limit 20000
set -g renumber-windows on

# ── Activity monitoring ──────────────────────────
setw -g monitor-activity off
set -g visual-activity off

# ── Resize behavior ──────────────────────────────
setw -g aggressive-resize on

# ── Responsiveness ───────────────────────────────
set -sg escape-time 0

# ── Layout ────────────────────────────────────────
unbind =
bind = select-layout tiled

# Double click avoids wake up key
bind -r n next-window
bind -r p previous-window
set -g repeat-time 1000# ── Status bar ────────────────────────────────────


# looks
set -g status-interval 5

set -g status-left "#[fg=green,bold]#S #[fg=white]| "
set -g status-left-length 20

set -g status-right '#{?client_prefix,#[fg=red]PREFIX ACTIVE,} #[fg=cyan]%H:%M #[fg=yellow]%d-%b-%y'

setw -g window-status-format "#I:#{pane_current_command}"
setw -g window-status-current-format "#I:#W*"

setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-style "fg=white,bg=default"
